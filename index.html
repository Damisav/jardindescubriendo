<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jardín Descubriendo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #ffffff;
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background-color: #dbeafe;
      color: #1d4ed8;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.375rem 0.875rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.75rem;
    }
    p {
      color: #64748b;
      line-height: 1.6;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Próximamente</span>
    <h1>Jardín Descubriendo</h1>
    <p>Estamos trabajando en la construcción de nuestra nueva plataforma web institucional.</p>
  </div>
</body>
</html>
